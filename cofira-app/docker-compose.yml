version: '3.8'

services:
  # ==========================================================================
  # OLLAMA: Servicio de IA local
  # ==========================================================================
  ollama:
    image: ollama/ollama:latest
    container_name: cofira_ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    # Descarga automatica del modelo qwen2.5 al iniciar
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /bin/ollama serve &
        sleep 5
        ollama pull qwen2.5:1.5b
        ollama pull llava:7b
        wait
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  # ==========================================================================
  # DATABASE: PostgreSQL
  # ==========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: cofira_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-cofira}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cofira_secret_2024}
      POSTGRES_DB: ${DB_NAME:-cofira_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cofira} -d ${DB_NAME:-cofira_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ==========================================================================
  # BACKEND: Node.js API
  # ==========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cofira_backend
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      DATABASE_URL: postgresql://${DB_USER:-cofira}:${DB_PASSWORD:-cofira_secret_2024}@postgres:5432/${DB_NAME:-cofira_db}?schema=public
      # Ollama configuracion - sin API externa
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:1.5b
      OLLAMA_VISION_MODEL: llava:7b
      JWT_SECRET: ${JWT_SECRET:-your_super_secret_jwt_key_2024}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:4200}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads
    restart: unless-stopped

  # ==========================================================================
  # FRONTEND: Angular (solo produccion)
  # ==========================================================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cofira_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    profiles:
      - production
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  ollama_data:
    driver: local
